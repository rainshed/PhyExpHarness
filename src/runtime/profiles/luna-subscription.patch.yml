# Authentication and model transport only; the agent loop stays in sdk-minimal.
- id: llm-deepseek
  disabled: true

- insert:
    - id: subscription-credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        path: !!js process.env.PHYEXP_CREDENTIAL_FILE
        watch: false
    - id: luna-provider
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          openai-codex:
            models:
              - id: !!js process.env.PHYEXP_SOLVER_MODEL ?? 'gpt-6-luna'
            retryPolicy:
              mode: normal
              maxRetries: 0
